# Cloudflare Pages configuration
# Place this file at repo root.
# Note: Cloudflare automatically applies Brotli/Gzip compression at the edge.
# In Cloudflare Pages dashboard:
#   Build command:     (leave empty — pages are pre-built by GitHub Actions)
#   Build output dir:  output
#   Root directory:    /

[build]
  command = ""
  publish = "output"

[[redirects]]
  # Redirect bare /salary-percentile/ to a default landing page
  from = "/salary-percentile/"
  to = "/salary-percentile/65k-80k/age/31-35/"
  status = 301

[[redirects]]
  # Redirect bare /savings-percentile/ placeholder
  from = "/savings-percentile/"
  to = "/"
  status = 302

[[redirects]]
  # Redirect bare /net-worth-percentile/ placeholder
  from = "/net-worth-percentile/"
  to = "/"
  status = 302

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=43200"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"
