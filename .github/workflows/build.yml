name: Build + Deploy

on:
  # Manual trigger (use this for Phase 1 controlled deploys)
  workflow_dispatch:
    inputs:
      phase:
        description: 'Build phase (1=50 pages, 2=500 pages)'
        required: true
        default: '1'
        type: choice
        options: ['1', '2']

  # Automated monthly rebuild (activate after Phase 2)
  # Uncomment when you're ready for automated monthly refreshes
  # schedule:
  #   - cron: '0 3 1 * *'   # 1st of every month at 3AM UTC

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install jinja2

      - name: Generate pages (Phase ${{ github.event.inputs.phase || '1' }})
        run: |
          python scripts/page_generator.py
        env:
          BUILD_PHASE: ${{ github.event.inputs.phase || '1' }}

      - name: Verify output
        run: |
          echo "── Output summary ──────────────────"
          find output -name "index.html" | wc -l | xargs echo "Pages generated:"
          echo "Sitemap entries:"
          grep -c "<url>" output/sitemap.xml || echo "0"
          echo "Sample pages:"
          find output -name "index.html" | head -5

      - name: Commit generated pages
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "Build Bot"
          git add output/ -A
          git diff --staged --quiet || git commit -m "Build: $(date '+%Y-%m-%d') · Phase ${{ github.event.inputs.phase || '1' }}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
